name: Build RHVoice APK (avtomatik + imzolash)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sizning repo fayllarini olish
        uses: actions/checkout@v4
        with:
          path: my-files

      - name: RHVoice eng so'nggi to'liq (stable) kodini yuklab olish
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/RHVoice/RHVoice/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          if [ -z "$LATEST_TAG" ]; then
            echo "XATO: Eng so'nggi release topilmadi, master ishlatiladi"
            LATEST_TAG="master"
          fi
          echo "Eng so'nggi to'liq release: $LATEST_TAG"
          git clone --recursive --branch "$LATEST_TAG" --depth 1 https://github.com/RHVoice/RHVoice.git rhvoice-src
          cd rhvoice-src && git describe --tags --always || echo "$LATEST_TAG"

      - name: Tizim paketlarini o'rnatish
        run: sudo apt-get update && sudo apt-get install -y scons pkg-config build-essential

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Build-tools o'rnatish
        run: sdkmanager --install "build-tools;34.0.0"

      - name: Imzolash kalitini tekshirish (YANGI KALIT YARATILMAYDI)
        run: |
          if [ ! -f my-files/release.keystore ]; then
            echo "========================================"
            echo "XATO: release.keystore topilmadi!"
            echo "Kalit yo'qolgan. Yangi kalit yaratilmaydi,"
            echo "chunki eski foydalanuvchilar yangilab bo'lmaydi."
            echo "========================================"
            exit 1
          fi
          echo "Kalit topildi — shu kalit ishlatiladi (o'zgartirilmaydi)."
          keytool -list -keystore my-files/release.keystore -storepass rhvoice123 | head -10

      - name: Preprocessor faylini joylashtirish
        run: |
          TARGET_DIR="rhvoice-src/src/android/RHVoice-core/src/main/java/com/github/olga_yakovleva/rhvoice/android"
          cp my-files/PhoneNumberPreprocessor.java "$TARGET_DIR/PhoneNumberPreprocessor.java"

      - name: settings.xml faylini almashtirish
        run: |
          TARGET_XML="rhvoice-src/src/android/RHVoice-core/src/main/res/xml/settings.xml"
          cp my-files/settings.xml "$TARGET_XML"

      - name: AppLanguagePickerActivity faylini joylashtirish
        run: |
          TARGET_DIR="rhvoice-src/src/android/RHVoice-core/src/main/java/com/github/olga_yakovleva/rhvoice/android"
          cp my-files/AppLanguagePickerActivity.java "$TARGET_DIR/AppLanguagePickerActivity.java"

      - name: AndroidManifest.xml ga activity qo'shish
        run: |
          MANIFEST="rhvoice-src/src/android/RHVoice-core/src/main/AndroidManifest.xml"
          python3 my-files/manifest_patch.py "$MANIFEST"

      - name: RHVoiceService.java kodini avtomatik moslash
        run: |
          FILE="rhvoice-src/src/android/RHVoice-core/src/main/java/com/github/olga_yakovleva/rhvoice/android/RHVoiceService.java"
          python3 my-files/patch_service.py "$FILE"

      - name: Paket nomi + versionCode majburan oshirish
        run: |
          BUILD_GRADLE="rhvoice-src/src/android/RHVoice-core/build.gradle"
          RUN_NUM=${{ github.run_number }}
          # Build-1 da versionCode ~118010 edi.
          # Endi 3000000 + run_number qilamiz — har doim katta bo'ladi.
          NEW_VC=$((3000000 + RUN_NUM))

          echo "========================================"
          echo "versionCode: $NEW_VC"
          echo "versionName: 1.18.${RUN_NUM}-uz"
          echo "========================================"

          # applicationId
          sed -i 's/applicationId "com.github.olga_yakovleva.rhvoice.android"/applicationId "com.github.olga_yakovleva.rhvoice.android.uz"/' "$BUILD_GRADLE"

          # revision_number
          sed -i "s/ext.revision_number = [0-9]*/ext.revision_number = ${RUN_NUM}/" "$BUILD_GRADLE"

          # baseVersionCode ni to'g'ridan-to'g'ri yozamiz
          sed -i "s/ext.baseVersionCode = .*/ext.baseVersionCode = ${NEW_VC}/" "$BUILD_GRADLE"

          # stable flavor dagi versionCode
          sed -i "s/versionCode = baseVersionCode/versionCode = ${NEW_VC}/" "$BUILD_GRADLE"
          sed -i "s/versionCode = baseVersionCode + 5/versionCode = $((NEW_VC + 5))/" "$BUILD_GRADLE"
          sed -i "s/versionCode = baseVersionCode + 9/versionCode = $((NEW_VC + 9))/" "$BUILD_GRADLE"

          # versionName
          sed -i 's/versionName ".*"/versionName "1.18.'"${RUN_NUM}"'-uz"/' "$BUILD_GRADLE"

          echo "--- Tekshiruv ---"
          grep -E "revision_number|baseVersionCode|versionCode|versionName|applicationId" "$BUILD_GRADLE" || true

          # sharedUserId olib tashlash
          MANIFEST="rhvoice-src/src/android/RHVoice-core/src/main/AndroidManifest.xml"
          sed -i 's/android:sharedUserId="com.github.olga_yakovleva.rhvoice"//' "$MANIFEST"
          sed -i 's/android:sharedUserLabel="@string\/app_name"//' "$MANIFEST"

          # Ilova nomi
          DONOT="rhvoice-src/src/android/RHVoice-core/src/main/res/values/donottranslate.xml"
          sed -i 's/<string name="app_name">RHVoice<\/string>/<string name="app_name">RHVoice UZ<\/string>/' "$DONOT"
          echo "Ilova nomi: RHVoice UZ"

      - name: Gradle xotira sozlamalari
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
        working-directory: rhvoice-src/src/android

      - name: gradlew huquqi
        run: chmod +x ./gradlew
        working-directory: rhvoice-src/src/android

      - name: APK yig'ish
        run: ./gradlew assembleStableRelease --stacktrace --no-daemon
        working-directory: rhvoice-src/src/android

      - name: APK'ni topish
        id: find_apk
        run: |
          APK_DIR="RHVoice-core/build/outputs/apk/stable/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "APK topilmadi!"
            find RHVoice-core/build/outputs -name "*.apk" || true
            exit 1
          fi
          echo "apk_path=rhvoice-src/src/android/$APK_FILE" >> $GITHUB_OUTPUT
          echo "Topilgan: $APK_FILE"
        working-directory: rhvoice-src/src/android

      - name: APK'ni tekislash va imzolash
        id: sign_apk
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d -name "34*" | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          UNSIGNED_APK="${{ steps.find_apk.outputs.apk_path }}"
          ALIGNED_APK="aligned-unsigned.apk"
          SIGNED_APK="rhvoice-uz-signed.apk"

          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks my-files/release.keystore \
            --ks-pass pass:rhvoice123 \
            --key-pass pass:rhvoice123 \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "signed_apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT
          echo "Imzolangan APK tayyor"

      - name: Artifacts'ga yuklash
        uses: actions/upload-artifact@v4
        with:
          name: rhvoice-apk-signed
          path: ${{ steps.sign_apk.outputs.signed_apk_path }}

      - name: Release yaratish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "RHVoice UZ - build #${{ github.run_number }} (v1.18.${{ github.run_number }}-uz)"
          files: ${{ steps.sign_apk.outputs.signed_apk_path }}
          body: |
            RHVoice UZ yangilanishi
            - versionCode: 3000000 + ${{ github.run_number }}
            - versionName: 1.18.${{ github.run_number }}-uz
            - Xuddi shu release.keystore bilan imzolangan (yangilanish ishlaydi)
            - Telefon raqami formatlash (+ faqat +998 da)
            - Kiril → rus ovozi sozlamasi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
